# This is a basic workflow to help you get started with Actions
## workflow badge link: https://github.com/firewalla/firewalla/actions/workflows/webpack.yml/badge.svg

name: webpack

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
      - master
      - eslint
  pull_request:
    branches: [master]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      # How far line coverage may fall below the latest master baseline, in
      # percentage points, before the build is failed.
      COVERAGE_TOLERANCE: "0.5"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Checkout fnm
        uses: actions/checkout@v4
        with:
          repository: firewalla/fnm.node8.x86_64
          path: fnm

      - uses: actions/setup-node@v4
        with:
          node-version: "16"

      # There is no lockfile in this repo, so setup-node's built-in cache can't be
      # used; cache npm's download directory directly instead. Keyed on
      # package.json so the cache rolls over whenever dependencies change.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node16-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node16-

      - run: npm install -g eslint@8.57.1
      - run: eslint --quiet ./ # todo, only eslint for diff files
      # yarn ships with the ubuntu runner image; installing it again cost between
      # one and seven minutes per run.
      - run: yarn --version || npm i -g yarn
      - run: yarn global add webpack-cli@5.1.4
      - run: mkdir -p webpack; cd webpack; yarn add webpack webpack-cli || true
      - run: $(yarn global bin)/webpack-cli -c .webpack/config_main.js
      - run: $(yarn global bin)/webpack-cli -c .webpack/config_firekick.js
      - run: $(yarn global bin)/webpack-cli -c .webpack/config_api.js
      - run: $(yarn global bin)/webpack-cli -c .webpack/config_mon.js
      - run: bash .webpack/prep-env.sh

      # Not piped into tee: a pipeline reports the exit status of its LAST command,
      # so `npm run coverage | tee ...` used to swallow both mocha failures and nyc's
      # own threshold failure, and coverage was then computed from a half-run suite.
      # The full output is in this step's log either way.
      - run: npm run coverage

      - name: Archive code coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./coverage/

      # Baseline is whatever the most recent push to master published. The exact key
      # never hits on a PR (it carries the PR's sha), so the prefix restore-key is what
      # resolves, and it returns the most recently created matching entry.
      - name: Restore coverage baseline
        uses: actions/cache/restore@v4
        with:
          path: .coverage-baseline
          key: coverage-baseline-master-${{ github.sha }}
          restore-keys: |
            coverage-baseline-master-

      # Read from coverage-summary.json (json-summary reporter, already enabled in
      # .nycrc.json) rather than grepping the text summary: the old grep ran over the
      # whole teed run output, so any test title containing "Lines" won the match.
      - name: Read coverage numbers
        id: cov
        run: |
          pct=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          for m in statements branches functions; do
            echo "$m=$(jq -r ".total.${m}.pct" coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"
          done
          baseline=""
          if [ -f .coverage-baseline/pct.txt ]; then
            baseline=$(cat .coverage-baseline/pct.txt)
          fi
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          if [ -n "$baseline" ]; then
            # bc renders values between -1 and 1 without a leading zero ("-.3").
            echo "delta=$(printf '%+.2f' "$(echo "$pct - $baseline" | bc -l)")" >> "$GITHUB_OUTPUT"
          fi

      - name: Coverage summary
        env:
          PCT: ${{ steps.cov.outputs.pct }}
          STATEMENTS: ${{ steps.cov.outputs.statements }}
          BRANCHES: ${{ steps.cov.outputs.branches }}
          FUNCTIONS: ${{ steps.cov.outputs.functions }}
          BASELINE: ${{ steps.cov.outputs.baseline }}
          DELTA: ${{ steps.cov.outputs.delta }}
        run: |
          {
            echo "## Test coverage"
            echo
            echo "| Metric | Coverage |"
            echo "| --- | --- |"
            echo "| **Lines** | **${PCT}%** |"
            echo "| Statements | ${STATEMENTS}% |"
            echo "| Branches | ${BRANCHES}% |"
            echo "| Functions | ${FUNCTIONS}% |"
            echo
            if [ -n "$BASELINE" ]; then
              echo "Baseline (latest master): **${BASELINE}%** — change: **${DELTA}** points"
              echo
              echo "Allowed drop: ${COVERAGE_TOLERANCE} points."
            else
              echo "No baseline was available for comparison, so the drop check was skipped."
              echo "The next push to master publishes one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage against baseline
        env:
          PCT: ${{ steps.cov.outputs.pct }}
          BASELINE: ${{ steps.cov.outputs.baseline }}
        run: bash .webpack/post-check.sh "$PCT" "$BASELINE" "$COVERAGE_TOLERANCE"

      - name: Stage new baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          PCT: ${{ steps.cov.outputs.pct }}
        run: |
          mkdir -p .coverage-baseline
          echo "$PCT" > .coverage-baseline/pct.txt

      - name: Publish coverage baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .coverage-baseline
          key: coverage-baseline-master-${{ github.sha }}
